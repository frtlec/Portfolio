name: Build and Deploy (monolith test stack)

on:
  push:
    branches: [feature/monolith-migration]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: Portfolio.Api/Dockerfile
          - name: selinozoglu-webui
            dockerfile: WebUI/SelinOzoglu/selin.ozoglu/Dockerfile
          - name: datamigration
            dockerfile: Portfolio.DataMigration/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }} (monolith tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          # ":latest" degil ":monolith" -- master'in prod image'ini asla ezmez.
          tags: ghcr.io/${{ github.repository_owner }}/portfolio-${{ matrix.name }}:monolith
          cache-from: type=gha,scope=monolith-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=monolith-${{ matrix.name }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure target directory exists on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: mkdir -p /opt/Portfolio-monolith

      # Sunucuda ayri bir dizin (/opt/Portfolio-monolith) kullaniyoruz,
      # boylece prod stack'in dizini (/opt/Portfolio) hic dokunulmadan kalir.
      - name: Copy compose file and cert to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.monolith.yml,https/aspnetapp.pfx"
          target: "/opt/Portfolio-monolith"

      - name: Pull images and restart (monolith test stack)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd /opt/Portfolio-monolith
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker-compose -f docker-compose.monolith.yml pull
            docker-compose -f docker-compose.monolith.yml up -d --remove-orphans
            docker image prune -f
