version: "3.8"

# Sadece yerel gelistirme icin: Postgres + RabbitMQ.
# Portfolio.Api ve WebUI buraya container olarak dahil degil -- onlar
# "dotnet run" / "ng serve" ile ayri calistirilip bu altyapiya baglanir.

services:
  portfoliodb:
    image: postgres:15-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - portfoliodb_local_volume:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=zk147olu
      - POSTGRES_DB=portfoliodb

  portfolio_rabbitmq:
    image: rabbitmq:3.8.14-management
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest

volumes:
  portfoliodb_local_volume:
