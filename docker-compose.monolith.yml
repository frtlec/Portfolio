version: "3.8"

# Paralel test stack (feature/monolith-migration branch icin).
# Artik gercek monolit mimariyi yansitiyor: tek API + tek Postgres + WebUI
# (+ RabbitMQ, kullanicinin tercihiyle korundu). Mevcut prod stack'ten
# (master -> /opt/Portfolio) tamamen izole calisir: image tag'i ":monolith",
# ayri host portlari, ayri volume/network (proje dizini adindan turetiliyor).
#
# ZORUNLU: sunucuda /opt/Portfolio-monolith/.env dosyasinda JWT_SIGNING_KEY
# tanimli olmali (rastgele, uzun bir secret) -- yoksa Portfolio.Api acilista
# hata verip kapanir (bkz. Portfolio.Api/Identity/TokenService.cs).
#
# Port tablosu:
#  portfolio.api      -> 8100 (http) / 8143 (https)
#  selinozoglu.webui  -> 8110 (http) / 12392 (https)
#  portfoliodb        -> 8432
#  portfolio_rabbitmq -> 8672 (amqp) / 8673 (mgmt)

services:
  portfoliodb:
    image: postgres:15-alpine
    restart: always
    ports:
      - "8432:5432"
    volumes:
      - portfoliodb_volume:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=zk147olu
      - POSTGRES_DB=portfoliodb

  portfolio_rabbitmq:
    image: rabbitmq:3.8.14-management
    restart: always
    ports:
      - "8672:5672"
      - "8673:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest

  portfolio.api:
    image: ghcr.io/frtlec/portfolio-api:monolith
    restart: on-failure
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - "ConnectionStrings:PostgreSql=User ID=admin;Password=zk147olu;Server=portfoliodb;Port=5432;Database=portfoliodb;Pooling=true"
      - RabbitMQUrl=portfolio_rabbitmq
      - Jwt__SigningKey=${JWT_SIGNING_KEY}
      - Jwt__Issuer=https://portfolio-monolith.selinozoglu.com
      - ASPNETCORE_URLS=https://+:443;http://+:80
      - ASPNETCORE_HTTPS_PORT=8143
      - ASPNETCORE_Kestrel__Certificates__Default__Password=zk147olu
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/aspnetapp.pfx
    ports:
      - "8100:80"
      - "8143:443"
    depends_on:
      - portfoliodb
      - portfolio_rabbitmq
    volumes:
      # Gercek foto verisiyle test edebilmek icin ayni klasore bagliyoruz,
      # ama read_only:true ile bu stack'in prod veriye yazmasini engelliyoruz.
      - type: bind
        source: /opt/app_data/portfolio_photostock_data
        target: /app/wwwroot/photos
        read_only: true
      - type: bind
        source: /opt/app_data/portfolio_photostock_data
        target: /app/wwwroot/svg
        read_only: true
      - ./https/aspnetapp.pfx:/https/aspnetapp.pfx:ro

  selinozoglu.webui:
    image: ghcr.io/frtlec/portfolio-selinozoglu-webui:monolith
    restart: on-failure
    ports:
      - "8110:80"
      - "12392:443"
    depends_on:
      - portfolio.api

volumes:
  portfoliodb_volume:
